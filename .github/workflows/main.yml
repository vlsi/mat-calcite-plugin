name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  # Replays the matrix of an earlier run: its seed is in the step summary of "Matrix Preparation"
  workflow_dispatch:
    inputs:
      matrix_rng_seed:
        description: RNG seed
        required: false

concurrency:
  # On main/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' ) && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  matrix_prep:
    name: Matrix Preparation
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      MATRIX_JOBS: 4
      # Every push to a pull request draws the same jobs
      GITHUB_PR_NUMBER: ${{ github.event.number }}
      RNG_SEED: ${{ github.event.inputs.matrix_rng_seed }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - id: set-matrix
        name: Generate the matrix
        shell: bash
        run: |
          npm ci --prefix .github/workflows
          node .github/workflows/matrix.mjs

  build-test:
    needs: matrix_prep
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: ./.github/actions/setup_java
        with:
          java_version: ${{ matrix.java_version }}
          java_distribution: ${{ matrix.java_distribution }}
      - name: Build
        uses: ./.github/actions/build
        with:
          maven_args: ${{ matrix.maven_args }}
          test_jvm_args: ${{ matrix.test_jvm_args }}
          upload_update_site: ${{ matrix.publish }}
      - name: Publish Eclipse update site
        if: matrix.publish && github.repository == 'vlsi/mat-calcite-plugin' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/publish-update-site
        with:
          update_site_token:
            ${{ secrets.UPDATE_SITE_TOKEN }}

  ci-gate:
    name: CI Gate
    needs: [matrix_prep, build-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
